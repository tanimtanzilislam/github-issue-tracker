<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Issues Tracker</title>

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
</head>

<body class="bg-[#F8FAFC]">

    <!-- ================= NAVBAR ================= -->

    <nav class="bg-white shadow-sm">

        <div class="max-w-[1110px] mx-auto navbar">

            <div class="navbar-start">

                <div class="flex items-center gap-2">

                    <img
                        class="w-9 h-9"
                        src="./assets/github-logo.png"
                        alt="GitHub">

                    <h2 class="text-xl font-semibold">
                        GitHub Issues Tracker
                    </h2>

                </div>

            </div>

            <div class="navbar-end flex gap-3">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search Issues..."
                    class="input input-bordered w-64">

                <button class="btn btn-primary">

                    <i class="fa-solid fa-plus"></i>

                    New Issue

                </button>

            </div>

        </div>

    </nav>



    <!-- ================= TAB SECTION ================= -->

    <div class="max-w-[1110px] mx-auto mt-5 bg-white rounded-lg p-5">

        <div class="flex gap-4">

            <button
                id="allBtn"
                class="btn btn-primary">

                All

            </button>

            <button
                id="openBtn"
                class="btn">

                Open

            </button>

            <button
                id="closedBtn"
                class="btn">

                Closed

            </button>

        </div>

    </div>



    <!-- ================= ISSUE SUMMARY ================= -->

    <div class="max-w-[1110px] mx-auto mt-5 bg-white rounded-lg p-5 flex justify-between items-center">

        <div class="flex items-center gap-3">

            <img
                class="w-10 h-10"
                src="./assets/Aperture.png"
                alt="">

            <div>

                <h2
                    id="issueCount"
                    class="font-bold text-lg">

                    0 Issues

                </h2>

                <p class="text-gray-500 text-sm">

                    Track and manage your project issues

                </p>

            </div>

        </div>



        <div class="flex gap-5">

            <div class="flex items-center gap-2">

                <span class="w-3 h-3 rounded-full bg-green-500"></span>

                <span>Open</span>

            </div>

            <div class="flex items-center gap-2">

                <span class="w-3 h-3 rounded-full bg-purple-500"></span>

                <span>Closed</span>

            </div>

        </div>

    </div>



    <!-- ================= ISSUE CONTAINER ================= -->

    <section
        id="issueContainer"
        class="max-w-[1200px] mx-auto mt-5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

    </section>



    <!-- ================= FOOTER ================= -->

    <footer class="text-center py-8 text-gray-500 text-sm">

        GitHub Issues Tracker © 2026

    </footer>

    <script src="./script/app.js"></script>

</body>

</html>
