<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github-Issue-Tracker</title>

    <!-- tailwind cdn -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <!-- daisyUI cdn -->
      <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- font-awesome cdn -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

 <style>
    *{
     font-family: "Geist", sans-serif;
    }
 </style>

 <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">
</head>
<body>
   


    <section>
    <div class="min-h-screen max-w-md mx-auto py-20 bg-base-300">

        <div class="logo flex justify-center items-center" >
            <img src="assets/github-logo.png" alt="">
            
        </div>
        <h2 class="flex justify-center items-center font-bold pt-5 pb-0">GitHub Issues Tracker</h2>
     
        <p class="flex justify-center items-center text-[#64748B] mt-0">Sign in to manage your issues</p>

<div class=" flex justify-center items-center pt-5">
            <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
  

  <label class="label">Username</label>
  <input type="text" class="input" placeholder="Enter Username" />
  <p class="text-[#4A00FF]">Default: admin</p>

  <label class="label">Password</label>
  <input type="password" class="input" placeholder="Enter Password" />
  <p class="text-[#4A00FF]">Default: admin123</p>

  
</fieldset>
        </div>

 <div class="flex justify-center items-center pt-5 "><button class="btn btn-primary w-[326px]">Sign In</button></div>
<div class="flex items-center gap-4 my-6 px-16">
  <div class="flex-1 border-t border-gray-300"></div>
  <span class="text-gray-500 text-sm">or</span>
  <div class="flex-1 border-t border-gray-300"></div>
</div>
 <p class="flex justify-center items-center text-gray-500">Demo Credentials:</p>
<div class="bg-[#F2F2F7] w-[445px] h-[90px] pt-5 px-16">

    <span class="font-bold">Username:</span><p></p>
  
</div>
</div>



       
    </div>
    </section>


   
</body>
</html>
